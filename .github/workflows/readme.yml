name: README

on:
  push:
    branches: [main]
    paths: ['plaques.yml', 'scripts/**', 'README.md', '.github/workflows/readme.yml']
  schedule:
    - cron: '17 3 * * *'   # chaque nuit : partition des contributions
  workflow_dispatch:

concurrency:
  group: readme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          git diff --cached --quiet || (git commit -m "readme: partition et plaques" && git push)
